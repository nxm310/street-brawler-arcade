<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Street Brawler Arcade — La Tournée des Légendes (6 Combattants &amp; 6 Arènes)</title>
  <link rel="preload" as="image" href="assets/ui/title_screen.png" />
  <link rel="preload" as="image" href="assets/ui/france_map.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-badge">ARCADE EDITION</span>
      <h1>STREET BRAWLER ARCADE</h1>
    </div>

    <div class="header-controls">
      <div class="segmented" role="group" aria-label="Mode de jeu">
        <button id="modeBotHeaderBtn" type="button" class="btn is-active">1J vs BOT</button>
        <button id="modeLocalHeaderBtn" type="button" class="btn">2J LOCAL</button>
      </div>

      <label for="botDiffSelect" class="dock-label">Bot :</label>
      <select id="botDiffSelect" class="select-input" aria-label="Difficulté du Bot">
        <option value="easy">Facile</option>
        <option value="normal" selected>Normal</option>
        <option value="hard">Difficile</option>
      </select>

      <button id="openSelectHeaderBtn" type="button" class="btn">Combattants &amp; Carte</button>
      <button id="attractToggleBtn" type="button" class="btn">🎬 Mode Veille</button>
      <button id="audioToggleBtn" type="button" class="btn">Musique 16-bit : ON</button>
      <button id="fullscreenBtn" type="button" class="btn">Plein Écran</button>
    </div>
  </header>

  <main class="main-wrap">
    <div id="stageContainer" class="stage-container">
      <canvas id="gameCanvas" width="1280" height="720" tabindex="0" aria-label="Arène de combat Street Brawler Arcade"></canvas>

      <!-- Écran Fin de Match -->
      <section id="matchOverOverlay" class="overlay" aria-labelledby="matchWinnerTitle" hidden>
        <div class="overlay-card">
          <h2 id="matchWinnerTitle">VICTOIRE !</h2>
          <p id="matchWinnerSubtitle" class="overlay-sub"></p>
          <div class="overlay-actions">
            <button id="rematchBtn" type="button" class="btn btn-primary btn-lg">REJOUER</button>
            <button id="changeSetupBtn" type="button" class="btn btn-secondary btn-lg">CHANGER COMBATTANTS / ARÈNE</button>
            <button id="matchToMenuBtn" type="button" class="btn btn-lg">ÉCRAN TITRE</button>
          </div>
        </div>
      </section>
    </div>

    <!-- Barre d'arènes en direct & commandes clavier -->
    <section class="control-dock" aria-label="Commandes rapides et contrôles clavier">
      <div class="dock-row">
        <div class="arena-bar">
          <span class="dock-label">Arènes en direct :</span>
          <div id="quickArenaBar" class="arena-bar"></div>
        </div>

        <div class="action-buttons">
          <button id="triggerSpecialP1Btn" type="button" class="btn btn-primary">⚡ Spécial J1</button>
          <button id="triggerSpecialP2Btn" type="button" class="btn btn-secondary">⚡ Spécial J2</button>
          <button id="refillSuperBtn" type="button" class="btn">🔋 Charger Spécial 100%</button>
        </div>
      </div>

      <div class="controls-guide">
        <div>
          <strong>J1 :</strong> Q/A &amp; D bouger · <strong>ESPACE : Sauter</strong> · S se baisser · <strong>F : Poing</strong> (R fort) · <strong>G : Pied</strong> (S+G Balayette) · <strong>C : Parade</strong> · <strong>ENTRÉE : Spécial</strong>
        </div>
        <div id="controlsP2Text">
          BOT IA : contrôle automatique (difficulté réglable en haut)
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="js/game.js"></script>
</body>
</html>
